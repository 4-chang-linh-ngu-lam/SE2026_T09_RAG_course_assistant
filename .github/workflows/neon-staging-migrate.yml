name: Neon staging migration

on:
  workflow_dispatch:
    inputs:
      run_initial_migration:
        description: Apply Core migrations to the empty Neon staging database
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: neon-staging-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.run_initial_migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: neon-staging
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/pyproject.toml
      - run: pip install -e .
      - name: Upgrade and verify the staging schema
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
