name: Neon staging notification drain

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-staging-notification-drain
  cancel-in-progress: false

jobs:
  drain:
    if: github.event_name == 'workflow_dispatch' || vars.NEON_STAGING_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: neon-staging
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/pyproject.toml
      - run: pip install -e .
      - name: Process one notification batch
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
        run: python -m app.modules.notification.worker --once --batch-size 100
