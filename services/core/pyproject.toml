[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "rag-course-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3", "PyJWT>=2.10,<3", "argon2-cffi>=23.1,<26", "email-validator>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.27,<1", "httpx2>=2,<3", "ruff>=0.8,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
